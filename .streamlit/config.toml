# Streamlit configuration.
#
# NO [theme] SECTION — deliberately.
#
# A `[theme]` block is injected by Streamlit into the document *after* the app's
# own stylesheet, setting --background-color, --text-color and the widget
# surfaces directly. Pinning `base = "dark"` there meant the in-app Appearance
# toggle changed our CSS variables correctly while Streamlit's own dark theme
# kept painting over them — so the toggle appeared to do nothing.
#
# Theming is owned entirely by `sa_insights.ui.theme_css()`, which emits tokens
# for the selected theme and styles the Streamlit surfaces from them. One source
# of truth, so a theme switch cannot be half-applied.

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
